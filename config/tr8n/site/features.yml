#############################################################################
# Tr8n Features Configuration
#
# Default settings for all environments
#
# You can overload any feature for any environment by changing the
# environment settings at the bottom of the file
#############################################################################

defaults: &defaults
  dashboard:
    tab_position:     1
    title:            Dashboard
    link:             :translator
    controller:       translator
    actions:          [index]
    default_language: true
    manager_only:     false
    enabled:          true

  sitemap:
    tab_position:     2
    title:            Site Map
    link:             :phrases_map
    controller:       phrases
    actions:          [map, index, view]
    default_language: false
    manager_only:     false
    enabled:          true

  phrases:
    tab_position:     3
    title:            Phrases
    link:             :phrases
    controller:       phrases
    actions:          [index, view]
    default_language: false
    manager_only:     false
    enabled:          true

  relationships:
    tab_position:     4
    title:            Relationships
    link:             :relationships
    controller:       relationships
    actions:          [index, new, help, path]
    default_language: true
    manager_only:     true
    enabled:          true

  translations:
    tab_position:     5
    title:            Translations
    link:             :translations
    controller:       translations
    actions:          [index, view]
    default_language: false
    manager_only:     false
    enabled:          true

  awards:
    tab_position:     5
    title:            Awards
    link:             :awards
    controller:       awards
    actions:          [index]
    default_language: true
    manager_only:     false
    enabled:          true

  forum:
    tab_position:     6
    title:            Discussions
    link:             :forum
    controller:       forum
    actions:          [index, topic, message]
    default_language: true
    manager_only:     false
    enabled:          true

  glossary:
    tab_position:     7
    title:            Glossary
    link:             :glossary
    controller:       glossary
    actions:          [index]
    default_language: true
    manager_only:     false
    enabled:          true

  help:
    tab_position:     8
    title:            Help
    link:             :help
    controller:       help
    actions:          []
    default_language: true
    manager_only:     false
    enabled:          true

  language:
    title:            Manage Language
    link:             :language
    controller:       language
    actions:          [index]
    default_language: true
    manager_only:     true
    enabled:          true

#############################################################################
# Environment Settings
# You can overload any feature defined in the defaults for any environment
#############################################################################
development:
  <<: *defaults

test:
  <<: *defaults

production:
  <<: *defaults
